<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Voom - Panel de Administración</title>

  <!-- Metadatos y Estilos -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

  <!-- Header de Control Administrativo -->
  <header class="bg-slate-800/80 backdrop-blur-md border-b border-slate-700/80 px-6 py-4 flex items-center justify-between sticky top-0 z-50">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 bg-gradient-to-tr from-orange-500 to-amber-500 rounded-2xl flex items-center justify-center text-white font-black text-base shadow-lg shadow-orange-500/20">
        🛡️
      </div>
      <div>
        <span class="text-lg font-black text-white tracking-tight leading-tight block">Voom Control</span>
        <span class="text-[10px] text-orange-400 font-extrabold uppercase tracking-wider">Panel de Administración</span>
      </div>
    </div>

    <div class="flex items-center space-x-4">
      <div class="text-right">
        <span id="admin-user" class="text-xs font-black text-slate-200 block">Verificando sesión...</span>
        <span class="text-[9px] font-bold text-emerald-400 uppercase tracking-wider">● Sistema Operativo</span>
      </div>
      <button onclick="cerrarSesionAdmin()" class="bg-slate-700 hover:bg-rose-600/20 text-slate-300 hover:text-rose-400 font-bold text-xs px-4 py-2.5 rounded-xl transition-all border border-slate-600">
        Salir
      </button>
    </div>
  </header>

  <!-- Contenido Principal del Panel -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-6 space-y-6">
    
    <!-- Tarjetas de Resumen / Estadísticas -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="bg-slate-800/50 border border-slate-700/80 p-6 rounded-3xl shadow-xl">
        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block">Viajes Activos Hoy</span>
        <span id="stat-viajes" class="text-3xl font-black text-white mt-2 block">0</span>
      </div>
      <div class="bg-slate-800/50 border border-slate-700/80 p-6 rounded-3xl shadow-xl">
        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block">Conductores Conectados</span>
        <span id="stat-conductores" class="text-3xl font-black text-orange-400 mt-2 block">0</span>
      </div>
      <div class="bg-slate-800/50 border border-slate-700/80 p-6 rounded-3xl shadow-xl">
        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block">Pasajeros Registrados</span>
        <span id="stat-pasajeros" class="text-3xl font-black text-emerald-400 mt-2 block">0</span>
      </div>
    </div>

    <!-- Sección de Monitoreo / Solicitudes Recientes -->
    <div class="bg-slate-800/50 border border-slate-700/80 rounded-3xl p-6 shadow-xl space-y-4">
      <div class="flex items-center justify-between pb-4 border-b border-slate-700/80">
        <h2 class="text-base font-black text-white tracking-tight uppercase">Solicitudes y Monitoreo en Vivo</h2>
        <button onclick="cargarDatosAdmin()" class="bg-orange-500 hover:bg-orange-600 text-white font-extrabold text-xs px-4 py-2.5 rounded-xl transition-all shadow-lg shadow-orange-500/20">
          Actualizar Datos 🔄
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs text-slate-300">
          <thead class="bg-slate-900/50 uppercase text-[10px] text-slate-400 tracking-wider">
            <tr>
              <th class="p-4 rounded-l-xl">ID Viaje</th>
              <th class="p-4">Pasajero</th>
              <th class="p-4">Origen / Destino</th>
              <th class="p-4">Estado</th>
              <th class="p-4 rounded-r-xl text-right">Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-viajes-body" class="divide-y divide-slate-700/50">
            <tr>
              <td colspan="5" class="p-6 text-center text-slate-500">Cargando registros del sistema...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Script de Conexión y Lógica Administrativa -->
  <script>
    // Inicialización o lógica conectada a Supabase para administración
    async function cargarDatosAdmin() {
      console.log("Cargando datos administrativos...");
      // Aquí puedes integrar tus consultas directas a las tablas de Supabase
    }

    function cerrarSesionAdmin() {
      window.location.href = "./index.html";
    }

    window.addEventListener('DOMContentLoaded', () => {
      cargarDatosAdmin();
    });
  </script>
</body>
</html>
